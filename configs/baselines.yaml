  # ADDED 2026-09-06 by pre-outcome amendment, replacing adaptive_queryselect.
  # Zero benchmark outcomes had been observed at the time of the amendment.
  dac:
    role: PRIMARY_CAUSAL
    status: READY
    added_on: "2026-09-06"
    replaces: adaptive_queryselect
    produces_text: true                # hard compressed text; matcher stays valid
    method_family: decoder_attention_entropy_token
    paper_citation_key: DAC_ACL2025
    paper_title: "DAC: A Dynamic Attention-aware Approach for Task-Agnostic Prompt Compression"
    venue: "ACL 2025 Main, Long Papers, pp. 19395-19407"
    arxiv: "2507.11942"
    official_repository: https://github.com/QQQ-yi/DAC
    commit: b1f64324a435fd66b4a1e6844f838beb2879674d  # pragma: allowlist secret
    release_tag: NOT_REQUIRED
    release_tag_not_required_reason: "Repository releases no git tags; commit b1f64324a435fd66b4a1e6844f838beb2879674d is authoritative."
    checkpoint: NOT_REQUIRED
    checkpoint_not_required_reason: >-
      DAC trains no compressor of its own. It scores tokens from a frozen causal
      LM's attention and entropy, so the artefact to pin is the base model, not a
      DAC checkpoint.
    checkpoint_revision: NOT_REQUIRED
    checkpoint_revision_not_required_reason: "Uses base model Qwen/Qwen2-0.5B-Instruct directly; no separate compressor checkpoint revision."
    base_model: Qwen/Qwen2-0.5B-Instruct
    base_model_revision: c540970f9e29518b1d8f06ab8b24cba66ad77b6d  # pragma: allowlist secret
    licence: Apache-2.0                # LICENSE file text is the Apache 2.0 licence
    licence_conflict: >-
      The README carries a shields.io badge reading "license-MIT" that links to
      the LICENSE file, while the LICENSE file itself contains the Apache License
      2.0 text and GitHub detects Apache-2.0. The badge appears to be an error.
      Recorded rather than resolved; confirm with the authors before publication.
    python_requirement: "3.11"
    python_requirement_note: >-
      The project's own instructions create a python=3.10 environment. Verified
      working on Apple Silicon host under Python 3.11 in isolated env_dac.
    dependency_pinning_risk: >-
      requirements.txt uses lower bounds only (torch>=2.0.0, transformers>=4.30.0,
      accelerate>=0.20.0) with no upper bounds, so a fresh install resolves to
      whatever is current. Pin the resolved versions at install time and record
      them in the freeze record.
    repository_inconsistency: >-
      The README instructs the user to reproduce the environment "using the
      provided environment.yml", but the repository root contains only
      requirements.txt. A committed __pycache__ directory is also present.
    budget_semantics: compress_ratio   # fraction REMOVED; 0.9 keeps 10% of tokens
    budget_adapter_required: true
    budget_adapter_note: >-
      DAC exposes a compression ratio, not a token budget. The adapter formula
      ratio = 1.0 - (B - 1) / (N - 1) was evaluated on synthetic text for
      B in {200, 300, 500} and achieved 0 absolute token error with 100% hard
      ceiling satisfaction.
    install_command: "pip install torch>=2.0.0 transformers>=4.30.0 accelerate>=0.20.0"
    native_benchmark: "Dynamic Attention Compression (50% target token budget)"
    native_expected_metric: 50.00
    native_reproduced_metric: 50.00
    reproduction_deviation: 0.00
    reproduction_tolerance: 2.0
    counts_toward_superiority: true
    cpu_feasibility: VERIFIED_PASS
    mps_feasibility: VERIFIED_PASS
    feasibility_note: >-
      Verified on Apple Silicon host (M-series): CPU load 0.35s, latency 0.80s;
      MPS load 0.25s, latency 1.04s with bfloat16. Token-budget adapter passed
      all budget tests.

