# Immutable baseline registry.
#
# STATUS OF THIS FILE: every external method ships NOT_READY with an unresolved
# commit/checkpoint. Those fields are deliberately null rather than guessed --
# a fabricated revision would make the reproducibility chain a fiction. They are
# resolved at install time, in the private workspace, and the resolved copy is
# what enters the freeze record.
#
# A method becomes benchmark-eligible only after every REQUIRED field is
# resolved AND the reproduction gate passes on a public/native task.

version: 1
resolved: false

superiority:
  required_wins: 3
  denominator_role: PRIMARY_CAUSAL     # the legacy anchor never counts
  criteria:
    - lower_95CI(delta_A) > 0
    - lower_95CI(delta_Ccomm) > 0
  bootstrap_replicates: 10000
  pairing: document-clustered

baselines:

  full_context:
    role: CONTROL
    status: READY
    produces_text: true
    notes: "Reference upper bound. NOT budget matched."
    counts_toward_superiority: false

  head_truncation:
    role: CONTROL
    status: READY
    produces_text: true
    counts_toward_superiority: false

  uniform_atoms:
    role: CONTROL
    status: READY
    produces_text: true
    notes: >-
      Uses the EXACT same renderer as CausalRelay. This control is mandatory:
      it is what makes CausalRelay-vs-Uniform an allocation comparison rather
      than a rendering comparison.
    counts_toward_superiority: false

  vanilla_relay:
    role: CONTROL
    status: NOT_READY
    produces_text: true
    notes: "Requires a pinned relay model. Uses the frozen global downstream task only."
    counts_toward_superiority: false

