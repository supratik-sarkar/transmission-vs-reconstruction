# Immutable baseline registry.
#
# STATUS OF THIS FILE: fields resolved on 2026-09-05 from official release pages
# and the Hugging Face model API carry their real values. Fields that could not
# be resolved from official evidence remain null and name the reason -- a
# fabricated revision would make the reproducibility chain a fiction. Remaining
# nulls are resolved at install time, on a networked host, and the resolved copy
# is what enters the freeze record.
#
# NO METHOD IS BENCHMARK_READY. No checkpoint has been downloaded, no dependency
# installed, no native example executed and no Mac timing measured. Every method
# still requires the reproduction gate on a public/native task.
#
# A method becomes benchmark-eligible only after every REQUIRED field is
# resolved AND the reproduction gate passes on a public/native task.
#
# Every comparator runs in its OWN isolated virtual environment, invoked
# out-of-process behind the adapter boundary. None of these dependencies may
# enter the core package, whose scientific core is stdlib + NumPy.

version: 1
resolved: false
resolution_date: "2026-09-06"
resolution_evidence: "github release pages + raw files + huggingface model API; no SHA or hash inferred"

# Pre-outcome amendment history. Nothing here may be edited after a benchmark
# outcome exists; the record is what lets a reader verify that comparator
# changes were not results-driven.
amendments:
  - id: P-6
    date: "2026-09-06"
    kind: comparator_substitution
    benchmark_outcomes_observed_before_amendment: 0
    original_primary_set: [provence, adaptive_queryselect, cpc, llmlingua2]
    amended_primary_set: [provence, cpc, llmlingua2, dac]
    removed: adaptive_queryselect
    removal_reason: missing_executable_artefact
    removal_evidence_date: "2026-09-05"
    removal_evidence: >-
      No Adaptive QuerySelect checkpoint is published. The author's Hugging Face
      account holds exactly three models and none of them is one; the repository
      README describes training "the QuerySelect and Adaptive QuerySelect encoder
      model" but links a single artefact, acnagle/QuerySelect. The repository
      also carries no LICENSE file, so no redistribution permission is granted by
      default.
    rejected_alternatives:
      - "Run acnagle/QuerySelect and report it as Adaptive QuerySelect -- rejected: misreports what was benchmarked."
      - "Retrain Adaptive QuerySelect to preserve the row -- rejected: outside the compute plan."
    added: dac
    addition_rationale: >-
      DAC emits a hard compressed text, so atom-level transmission T_z stays
      observable through the same deterministic matcher that every other primary
      comparator uses. It is also a genuinely distinct method family.
    contingency_added: selective_context
    contingency_role: CONTINGENCY_CAUSAL

  - id: P-7
    date: "2026-09-06"
    kind: superiority_rule
    benchmark_outcomes_observed_before_amendment: 0
    before: "at least 3 qualifying wins among PRIMARY_CAUSAL comparators"
    after: >-
      at least 3 qualifying wins spanning at least 3 distinct declared method
      families; fewer than 3 distinct BENCHMARK_READY families means no
      SOTA-superiority headline at all
    reason: >-
      Two of the originally pre-registered primaries shared the XLM-RoBERTa-large
      token-classification backbone and the LLMLingua-2 training pipeline, so the
      original rule could be satisfied by two members of one family. Counting
      those as two independent wins overstates breadth.

  - id: P-8
    date: "2026-09-09"
    kind: PRE_OUTCOME_PROTOCOL_COMPLETION
    benchmark_outcomes_observed_before_amendment: 0
    reason: "Pre-outcome calibration sample size resolved to 50 documents, establishing disjoint partitions 50/100/100/200 totaling 450 documents."

  - id: P-9
    date: "2026-09-09"
    kind: comparator_contingency_activation
    benchmark_outcomes_observed_before_amendment: 0
    reason: >-
      Provence (licence clarification required) and CPC (unresolved weight licence)
      blocked from benchmark execution. Perception Compressor failed Candidate-1 gate
      due to unrunnable CUDA/pynvml dependency and Baidu Wangpan hosting. Fallback
      LongLLMLingua (causal_lm_perplexity_conditioned_compression) from Microsoft
      LLMLingua repository promoted to PRIMARY_CAUSAL. Native bring-up, fixed-budget
      adapter, and published reproduction (MeetingBank 50% target, 48.17% observed,
      diff 1.83 pp <= 2.0 pp) verified pass on Apple Silicon host.

superiority:
  required_wins: 3
  denominator_role: PRIMARY_CAUSAL     # the legacy anchor never counts
  criteria:
    - lower_95CI(delta_A) > 0
    - lower_95CI(delta_Ccomm) > 0
  bootstrap_replicates: 10000
  pairing: document-clustered

  # BINDING as of the 2026-09-06 pre-outcome amendment (P-7).
  #
  # Wins over comparators that share a backbone and a training pipeline are not
  # independent tests. The amended rule requires breadth of METHOD FAMILY, not
  # merely a count of comparators.
  #
  #   >= 4 BENCHMARK_READY primaries : need >= 3 qualifying wins from >= 3 families
  #   exactly 3 distinct families     : must beat all three
  #   < 3 distinct families           : NO SOTA-SUPERIORITY HEADLINE
  #
  # This may not be weakened after results are seen.
  family_aware: true
  required_distinct_families: 3
  legacy_anchor_counts_toward_headline: false

# Declared method families. A family label is asserted only where the technical
# implementation justifies it: shared backbone architecture, shared compression
# formulation, and shared training-data construction lineage.
method_families:
  # XLM-RoBERTa-large token classification. llmlingua2 and the retired
  # adaptive_queryselect differ by 102,400 parameters -- a classifier head --
  # and QuerySelect was trained through a vendored copy of the LLMLingua-2
  # data-collection and training pipeline. That is one family, not two.
  token_classification_xlmr: [llmlingua2, adaptive_queryselect]
  cross_encoder_sentence: [provence]
  decoder_lora_sentence: [cpc]
  bi_encoder_sentence: [recomp_extractive]
  # DAC scores tokens from a small causal decoder's attention and entropy, with
  # no trained compressor of its own. Distinct formulation, distinct backbone.
  decoder_attention_entropy_token: [dac]
  # LongLLMLingua scores and prunes context via causal LM perplexity conditioned
  # on global downstream instructions. Distinct formulation and causal mechanism.
  causal_lm_perplexity_conditioned_compression: [longllmlingua]
  # Selective Context scores lexical units by self-information from a base LM.
  # Related to DAC in using a frozen LM, but the signal (self-information over
  # lexical units) and the unit of selection differ.
  self_information_lexical: [selective_context]

baselines:

  full_context:
    role: CONTROL
    status: READY
    produces_text: true
    notes: "Reference upper bound. NOT budget matched."
    counts_toward_superiority: false

  head_truncation:
    role: CONTROL
    status: READY
    produces_text: true
    counts_toward_superiority: false

  uniform_atoms:
    role: CONTROL
    status: READY
    produces_text: true
    notes: >-
      Uses the EXACT same renderer as CausalRelay. This control is mandatory:
      it is what makes CausalRelay-vs-Uniform an allocation comparison rather
      than a rendering comparison.
    counts_toward_superiority: false

  vanilla_relay:
    role: CONTROL
    status: NOT_READY
    produces_text: true
    notes: "Requires a pinned relay model. Uses the frozen global downstream task only."
    counts_toward_superiority: false

