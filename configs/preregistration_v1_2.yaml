# ---------------------------------------------------------------------------
# PRE-OUTCOME AMENDMENT LOG
#
# Append-only provenance, not scientific parameters. Every entry records the
# date, the reason, and how many benchmark outcomes had been observed when the
# change was made. All three amendments below were made at zero observed
# outcomes; the accounting script fails if any entry omits those fields or
# records a non-zero count without saying so.
#
# Nothing here may be edited once an outcome exists.
# ---------------------------------------------------------------------------
amendments:
  - id: P-5
    date: "2026-09-06"
    kind: decoder_regime_assignment
    benchmark_outcomes_observed_before_amendment: 0
    reason: >-
      The protocol asserted deterministic generation at a pinned configuration as
      the primary regime and treated stochastic generation as a robustness check.
      Provider documentation cannot establish operational determinism, and an
      undocumented seed parameter cannot rule it out either. Regime assignment is
      now ternary and empirical: NOT_AUDITED until the 100x10 operational
      reproducibility audit runs on the pinned receiver configuration.
    before: "regime (D) is the primary protocol; (S) is a robustness check"
    after: >-
      regime assigned only by audit; (D) requires unanimous canonical outcomes on
      every audited input; otherwise (S); initial state NOT_AUDITED
    theory_unchanged: >-
      Regime (D) remains a live theoretical case. Theorem 1(ii-a) and the
      atom-level minimality results are retained unchanged; only the empirical
      assignment rule changed.
    also_frozen: "regime-(S) replication rule m* on the {1,2,3,5} grid at ratio 0.10"

  - id: P-6
    date: "2026-09-06"
    kind: comparator_substitution
    benchmark_outcomes_observed_before_amendment: 0
    reason: >-
      No Adaptive QuerySelect checkpoint is published; the authors' released
      weights correspond to the non-adaptive variant and the repository carries no
      LICENSE file. Running the published artefact under the adaptive name would
      misreport what was benchmarked, and retraining is outside the compute plan.
      Evidence gathered 2026-09-05 from the official repository and the authors'
      model host.
    original_primary_set: [provence, adaptive_queryselect, cpc, llmlingua2]
    amended_primary_set: [provence, cpc, llmlingua2, dac]
    removed: adaptive_queryselect
    removal_reason: missing_executable_artefact
    removal_evidence_date: "2026-09-05"
    added: dac
    addition_rationale: >-
      DAC (ACL 2025 Main) emits hard compressed text, so atom-level transmission
      T_z remains observable through the same deterministic matcher, and it is a
      genuinely distinct method family.
    rejected_alternatives:
      - "run the non-adaptive checkpoint under the adaptive name: misreports the benchmark"
      - "retrain the adaptive variant: outside the compute plan"
    contingency_added: selective_context
    contingency_reasons_enumerated: true

  - id: P-7
    date: "2026-09-06"
    kind: superiority_rule
    benchmark_outcomes_observed_before_amendment: 0
    reason: >-
      Two of the originally pre-registered primaries shared the XLM-RoBERTa-large
      token-classification backbone and the LLMLingua-2 training pipeline,
      differing by a 102,400-parameter classifier head. The original count-only
      rule could therefore be satisfied by two members of one family, which
      overstates the breadth of the result.
    before: "at least 3 qualifying wins among PRIMARY_CAUSAL comparators"
    after: >-
      at least 3 qualifying wins spanning at least 3 distinct declared method
      families; all eligible must be beaten when exactly 3 families are ready;
      fewer than 3 distinct ready families means no SOTA-superiority headline
    may_not_be_weakened_after_results: true

  - id: P-8
    date: "2026-09-09"
    kind: PRE_OUTCOME_PROTOCOL_COMPLETION
    benchmark_outcomes_observed_before_amendment: 0
    reason: >-
      Previously null calibration sample size lacked an executable frozen rule.
      The calibration split is a non-confirmatory design-resolution split used
      to resolve the primary handoff budget B*, Experiment-C eviction tolerance
      and subset size, receiver operational variance, and m* replication if
      regime (S). It is not used to estimate headline causal effects.
    before: "stages.calibration.documents = null"
    after: "stages.calibration.documents = 50, establishing disjoint partitions 50/100/100/200 totaling 450 documents"
    full_partition:
      calibration: 50
      stage1: 100
      stage2_dev: 100
      stage2_test: 200
      total: 450
      issuer_disjoint: true

  - id: P-9
    date: "2026-09-09"
    kind: comparator_contingency_activation
    benchmark_outcomes_observed_before_amendment: 0
    reason: >-
      Pre-outcome contingency activated because two originally intended
      primary families were not legally/executably benchmarkable (Provence
      licence clarification required; CPC checkpoint-weight licence/provenance
      unresolved). Perception Compressor failed the Candidate-1 gate due to
      unrunnable host dependencies (pynvml) and non-public data distribution
      (Baidu Wangpan). Authorized fallback LongLLMLingua (ACL 2024 / EMNLP 2023)
      from Microsoft LLMLingua repository is promoted to PRIMARY_CAUSAL.
      Mechanism audit confirms causal_lm_perplexity_conditioned_compression is
      materially distinct from token_classification_xlmr and
      decoder_attention_entropy_token. Native bring-up, fixed-budget adapter,
      and published reproduction passed within 2.0 pp tolerance on Apple Silicon.
    candidate_1_evaluation:
      candidate: Perception Compressor
      verdict: REJECTED
      reasons:
        - "Hard dependency on pynvml (NVIDIA NVML) and CUDA; unrunnable on Apple Silicon host"
        - "Guiding questions dataset hosted on Baidu Wangpan (pan.baidu.com) requiring manual interactive login with Chinese phone number"
        - "Requires gated Meta LLaMA-2-7b weights"
        - "Proprietary multi-query format rather than standard global task query"
    fallback_evaluation:
      candidate: LongLLMLingua
      verdict: PROMOTED_TO_PRIMARY
      family: causal_lm_perplexity_conditioned_compression
      repository: "https://github.com/microsoft/LLMLingua"
      commit: a411a3fa61df74411157b2512b592d5357bd8f17  # pragma: allowlist secret
      release_tag: v0.2.2
      base_model: "Qwen/Qwen2-0.5B-Instruct"
      base_model_revision: "c540970f9e29518b1d8f06ab8b24cba66ad77b6d"  # pragma: allowlist secret
      licence: MIT
      reproduction_condition: "MeetingBank-QA-Summary (target compression rate 0.50)"
      expected_metric: 50.00
      reproduced_metric: 48.17
      deviation: -1.83
      tolerance: 2.0



