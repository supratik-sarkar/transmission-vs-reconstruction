# Machine-consumable form of PREREGISTRATION v1.2.
#
# Every value carries an explicit status. "proposed" means NOT APPROVED: it is
# written down so a reviewer can accept or reject it, rather than discovering
# later that a number was frozen silently. Loading code must refuse to treat a
# proposed value as binding.

