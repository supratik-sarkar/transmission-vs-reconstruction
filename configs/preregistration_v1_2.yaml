# Machine-consumable form of PREREGISTRATION v1.2.
#
# Every value carries an explicit status. "proposed" means NOT APPROVED: it is
# written down so a reviewer can accept or reject it, rather than discovering
# later that a number was frozen silently. Loading code must refuse to treat a
# proposed value as binding.

version: "1.2"
binding: false
resolved: false
supersedes: "1.1"
note: "The v1.1 hash is void as a commitment."

integrity:
  authored_utc: null
  frozen_utc: null
  artifact_manifest_sha256: null
  source_pool_sha256: null
  code_commit: null

source_frame:
  # Was a bare value with no binding status, i.e. frozen silently. The primary
  # domain is a scientific commitment and must carry a status like any other.
  section: {value: mdna, status: frozen}
  window_tokens: {value: 2000, status: frozen}
  tokenizer: {value: cl100k_base, status: frozen}
  truncation: {value: hard, status: frozen}
  min_section_chars: {value: 500, status: frozen}
  inventory_equals_frame: {value: true, status: frozen}

atomizer:
  tiers: {value: [tier1], status: frozen}
  roles: {value: [entity, scope, period, numeric, provenance], status: frozen}
  model_used: {value: false, status: frozen}
  overlap_rule: {value: longest_span_then_role_order_then_start, status: frozen}
  duplicate_merge_key: {value: [role, canonical_value], status: frozen}
  conflict_groups_excluded: {value: true, status: frozen}
  human_verification_blocking: {value: true, status: frozen}
  kappa_gate: {value: 0.80, status: frozen}
  # PABAK is a DIAGNOSTIC for the kappa paradox. It may not override a failed
  # kappa gate.
  report_raw_agreement: {value: true, status: frozen}
  report_label_marginals: {value: true, status: frozen}
  pabak_is_diagnostic_only: {value: true, status: frozen}

sampling:
  k: {value: 3, status: frozen}
  rule: {value: "uniform WOR over ALL populated strata; one atom uniform within each", status: frozen}
  pi_formula: {value: "(k / m_i) * (1 / n_is)", status: frozen}
  sum_pi_equals_k: {value: true, status: frozen}
  min_populated_strata: {value: 3, status: frozen}
  before_relay: {value: true, status: frozen}
  hidden_from_compressors: {value: true, status: frozen}
  master_seed: {value: 20260907, status: frozen}

models:
  relay_model: {value: null, status: must_be_pinned}
  receiver_model: {value: null, status: must_be_pinned}
  decoder_regime_primary: {value: D, status: frozen}
  decoder_regime_robustness: {value: S, status: frozen}
  determinism_audit:
    prompts: {value: 100, status: frozen}
    prompt_strata: {value: [entity, scope, period, numeric, provenance], status: frozen}
    repeats: {value: 10, status: frozen}
    required_agreement: {value: 1.0, status: frozen}
    on_calibration_only: {value: true, status: frozen}

budget:
  # CALIBRATION-SELECTED. The realisation does not exist yet, so the leaf stays
  # `proposed`; the SELECTION RULE is frozen. B* = argmin_B |median_i(F_i/B) - 2|
  # over the candidate grid, ties toward the LARGER B, where F_i is the
  # deterministic full-inventory render cost of calibration document i. The rule
  # may read only deterministic source/render properties -- never receiver
  # outcomes, CausalRelay scores, comparator performance or final-test data.
  primary_output_tokens:
    value: null
    status: proposed
    resolution_stage: CALIBRATION
    selection_rule_status: FROZEN
    candidate_grid: [200, 250, 300, 350, 400, 500]
    target_rho: 2.0
    tie_break: larger
    rule: "argmin_B |median_i(F_i / B) - 2|"
  # Full context remains a separate reference row, not a sweep point.
  sweep_percent: {value: [50, 25, 10, 5], status: frozen}
  hard_ceiling: {value: true, status: frozen}
  same_tokenizer_all_methods: {value: true, status: frozen}

intervention:
  natural_message_edited: {value: false, status: frozen}
  insertion_rule: {value: overrun, status: frozen}
  insertion_position: {value: new_final_line, status: frozen}
  non_focal_invariance_checked: {value: true, status: frozen}
  delete_all_canonical_occurrences: {value: true, status: frozen}
  failure_cap_overall: {value: 0.15, status: frozen}
  failure_differential_cap: {value: 0.05, status: frozen}
  on_breach: {value: STOP_AND_REPAIR, status: frozen}

matcher:
  token_boundary: {value: true, status: frozen}
  substring_matching: {value: false, status: frozen}
  precision_gate: {value: 0.95, status: frozen}
  recall_gate: {value: 0.95, status: frozen}
  audit_n: {value: 200, status: frozen}
  audit_stratification: {value: {presence: 100, absence: 100}, status: frozen}
  blinded: {value: true, status: frozen}

sham:
  per_mechanism: {value: true, status: frozen}
  sign_convention: {value: "s = 2T - 1", status: frozen}
  # SUPERSEDES the global 20% rule. Drawn independently of receiver OUTCOMES,
  # but selection MAY depend on observed T -- that is what makes equal precision
  # per mechanism achievable. Inclusion probabilities are persisted.
  sampling: {value: mechanism_stratified, status: frozen}
  min_deletion_shams: {value: 50, status: frozen}
  min_insertion_shams: {value: 50, status: frozen}
  rate_floor: {value: 0.20, status: frozen}
  may_depend_on_observed_T: {value: true, status: frozen}
  may_depend_on_receiver_outcomes: {value: false, status: frozen}
  report_mechanisms_separately_before_pooling: {value: true, status: frozen}
  epsilon_bar_grid: {value: [0.0, 0.02, 0.05, 0.10, 0.15, 0.20], status: frozen}
  # Smallest epsilon_bar at which the region includes zero. Pure arithmetic on
  # existing estimates: requires NO additional provider calls.
  report_breakdown_point: {value: true, status: frozen}
  primary_analysis: {value: population_partial_identification, status: frozen}
  placebo_establishes_exclusion: {value: false, status: frozen}

experiment_b:
  local_window: {value: same_sentence, status: frozen}
  min_populated_roles: {value: 3, status: frozen}
  focal_absent_in_both_arms: {value: true, status: frozen}
  omitted_token: {value: "<<OMITTED>>", status: frozen}
  structure_assert: {value: true, status: frozen}
  t_bar_difference_role: {value: manipulation_check_only, status: frozen}
  supports:
    # The support is not approved (status), AND it additionally carries an
    # unmet precondition. Conflating the two in one field made the status
    # vocabulary unenforceable.
    # Support size frozen. The pre-outcome screening procedure is defined in
    # S11.1 of the prose preregistration and must complete before calibration.
    entity:
      size: 200
      k_eff: 199
      status: frozen
      screening_procedure: pre_outcome_registry_screen
      screening_status: NOT_STARTED
      screening_blocks: [CALIBRATION, STAGE1, STAGE2_DEV, STAGE2_TEST]
    period_annual: {size: 6, k_eff: 5, status: frozen}
    period_quarter: {size: 24, k_eff: 23, status: frozen}
    numeric_subtypes_randomised: {value: [pct], status: frozen}
  chance_reporting: {value: [nominal_1_over_k_eff, empirical_no_evidence], status: frozen}
  pooled_chance_reported: {value: false, status: frozen}

prior_probe:
  option: {value: B_stochastic_fresh_context, status: frozen}
  m_prior: {value: 10, status: frozen}
  one_atom_per_query: {value: true, status: frozen}
  # Half-open [lo, hi) with the final bin closed at 1.0. Secondary to the
  # continuous measurement-error-aware dose-response, which is primary.
  bins: {value: [[0.0, 0.3333], [0.3333, 0.6667], [0.6667, 1.0]], status: frozen}
  bin_boundary_convention: {value: half_open_lower_closed_final_bin_closed, status: frozen}
  dose_response_primary: {value: continuous_measurement_error_aware, status: frozen}
  order_invariance_subset: {value: 50, status: frozen}
  dose_response_form: {value: reliability_aware_stratification, status: frozen}
  errors_in_variables_model_used: {value: false, status: frozen}
  fallback: {value: A_binary_under_D, status: frozen}

inference:
  default_estimator: {value: hajek, status: frozen}
  two_phase_supported: {value: true, status: frozen}
  q_in_pilot: {value: 1.0, status: frozen}
  bootstrap: {value: document_clustered, status: frozen}
  replicates_final: {value: 10000, status: frozen}
  n_reported_in: {value: documents, status: frozen}
  unweighted_pooled_alone: {value: false, status: frozen}

gate:
  prior_threshold: {value: 0.10, status: frozen}
  reconstruction_threshold: {value: 0.10, status: frozen}
  rule: {value: "proceed if either clears; halt only if both fail", status: frozen}
  # Entity is deliberately EXCLUDED: prior access is strongest there, so
  # including it would make the gate easiest to clear. Provenance is excluded
  # because a note reference carries essentially no real-world prior.
  eligible_prior_classes: {value: [scope, period, numeric], status: frozen}
  is_significance_test: {value: false, status: frozen}
  post_hoc_adjustment_allowed: {value: false, status: frozen}

development_instrumentation:
  # Bounds the largest cost item in the project. Selection is role-stratified and
  # NEVER depends on receiver outcomes or observed Delta.
  max_instrumented_candidates_per_document: {value: 30, status: frozen}
  selection: {value: role_stratified_without_replacement, status: frozen}
  persist_second_stage_probability: {value: true, status: frozen}
  q_iz_positive: {value: true, status: frozen}

stages:
  calibration: {documents: null, status: frozen}
  stage1: {documents: 100, status: frozen}
  stage2_dev: {documents: 100, status: frozen}
  # May not be decreased after DEVELOPMENT. Any amendment must precede
  # final-test exposure.
  stage2_test: {documents: 200, status: frozen}
  stage1_stage2_overlap: {value: 0, status: frozen}
  issuer_disjoint: {value: true, status: frozen}
  test_manifest_immutable_after_freeze: {value: true, status: frozen}

benchmark:
  primary_required_textual_state: {value: true, status: frozen}
  reproduction_tolerance_pp: {value: 2.0, status: frozen}
  required_wins: {value: 3, status: frozen}
  criteria: {value: ["lower_95CI(delta_A) > 0", "lower_95CI(delta_Ccomm) > 0"], status: frozen}
  comparator_deletion_allowed: {value: false, status: frozen}
  comparator_substitution_allowed: {value: false, status: frozen}
  focal_secrecy_enforced: {value: true, status: frozen}

causalrelay:
  fit_split: {value: stage2_dev, status: frozen}
  target: {value: delta_budget, status: frozen}
  features: {value: frozen_pretreatment_source_side, status: frozen}
  # DEVELOPMENT-ADAPTIVE. The search space is frozen now; the winner is frozen
  # at the final-test freeze. No final-test adaptation is permitted.
  primary_family:
    value: null
    status: proposed
    resolution_stage: DEVELOPMENT
    search_rule_status: FROZEN
    search_space: [HistGradientBoostingRegressor, Ridge, ExtraTreesRegressor]
    selection: grouped_cv_by_document_on_development_only
  ablation_family: {value: Ridge, status: frozen}
  # Low-capacity source-only control. Model identity is fixed;
  # regularisation strength may be development-tuned.
  trivial_control: {value: role_only_mean_utility, status: frozen}
  cv: {value: grouped_by_document, status: frozen}
  renderer_shared_with_uniform: {value: true, status: frozen}
  renderer_uses_model: {value: false, status: frozen}
  test_labels_accessible: {value: false, status: frozen}

experiment_c:
  post_gate: {value: true, status: frozen}
  fully_instrumented_candidate_set: {value: true, status: frozen}
  subset_size:
    value: null
    status: proposed
    resolution_stage: CALIBRATION
    selection_rule_status: FROZEN
    candidate_grid: [20, 30, 50]
    rule: "largest candidate with projected Experiment-C receiver calls <= 15% of the planned DEVELOPMENT receiver-call budget AND matched-pair retention >= 80%"
    call_budget_fraction: 0.15
    retention_floor: 0.80
  eviction_tolerance_tokens:
    value: null
    status: proposed
    resolution_stage: CALIBRATION
    selection_rule_status: FROZEN
    candidate_grid: [0, 1, 2, 4, 8]
    rule: "smallest tolerance retaining >= 80% of otherwise-eligible matched pairs"
    retention_floor: 0.80
  # Normalised interaction ratio:
  #   r = mean_z |Delta^bu_z(with z') - Delta^bu_z(without z')| / mean_z |Delta^bu_z|
  # The ratio is ALWAYS reported with a bootstrap interval. Exceeding the
  # threshold removes the first-order oracle interpretation of G*; it never
  # hides the interaction.
  interaction_threshold: {value: 0.15, status: frozen}
  interaction_ratio_always_reported: {value: true, status: frozen}
  g_star_is_true_optimum: {value: false, status: frozen}
  eta_u_imputed_when_undefined: {value: false, status: frozen}

multihop:
  depths: {value: [1, 2, 3, 5], status: frozen}
  post_gate: {value: true, status: frozen}
  monotonicity_enforced: {value: false, status: frozen}
  dpi_claim: {value: false, status: frozen}
  plot_A_and_Tbar_together: {value: true, status: frozen}
