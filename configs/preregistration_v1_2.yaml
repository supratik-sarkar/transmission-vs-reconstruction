budget:
  # CALIBRATION-SELECTED. The realisation does not exist yet, so the leaf stays
  # `proposed`; the SELECTION RULE is frozen. B* = argmin_B |median_i(F_i/B) - 2|
  # over the candidate grid, ties toward the LARGER B, where F_i is the
  # deterministic full-inventory render cost of calibration document i. The rule
  # may read only deterministic source/render properties -- never receiver
  # outcomes, CausalRelay scores, comparator performance or final-test data.
  primary_output_tokens:
    value: 200
    status: frozen
    resolution_stage: CALIBRATION
    selection_rule_status: FROZEN
    candidate_grid: [200, 250, 300, 350, 400, 500]
    target_rho: 2.0
    tie_break: larger
    rule: "argmin_B |median_i(F_i / B) - 2|"
  # Full context remains a separate reference row, not a sweep point.
  sweep_percent: {value: [50, 25, 10, 5], status: frozen}
  hard_ceiling: {value: true, status: frozen}
  same_tokenizer_all_methods: {value: true, status: frozen}
  # Which tokenizer computes F_i, stated explicitly. Not the repository proxy,
  # not the receiver's, not a previous generation's. Tokenizers differ across
  # model generations by enough to move the rho=2 target a full grid step, so
  # B* is not portable and is recomputed whenever the primary relay model or
  # provider changes.
  f_i_tokenizer: {value: primary_relay_model_tokenizer, status: frozen}
  recompute_B_star_on_relay_model_change: {value: true, status: frozen}
  report_realised_rho: {value: true, status: frozen}

