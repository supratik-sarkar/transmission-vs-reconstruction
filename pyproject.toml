[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-fidelity"
version = "0.1.0"
description = "Causal measurement of transmission versus reconstruction in LLM handoffs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "Anonymous research authors"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "tiktoken>=0.8,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
hf = ["torch>=2.4", "transformers>=4.45", "accelerate>=1.0"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "mypy>=1.12,<2",
  "pre-commit>=4,<5",
  "detect-secrets>=1.5,<2",
  "types-PyYAML>=6.0",
]

[project.scripts]
handoff = "handoff_fidelity.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/handoff_fidelity/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["handoff_fidelity"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
