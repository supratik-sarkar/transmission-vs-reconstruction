[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-fidelity"
version = "0.2.0"
description = "Causal measurement and benchmarking toolkit for distinguishing transmitted from reconstructed information in chained language-model workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
keywords = ["causal-inference", "information-transmission", "evaluation", "context-compression"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

# The scientific core deliberately depends only on the standard library and
# NumPy, so the design invariants can be checked in a minimal environment.
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
tokenizer = ["tiktoken>=0.8,<1"]
ml        = ["scikit-learn>=1.5,<2"]
figures   = ["matplotlib>=3.8,<4"]
data      = ["pandas>=2.2,<3", "beautifulsoup4>=4.12,<5"]
providers = ["openai>=1.0", "anthropic>=0.40", "google-genai>=1.0"]
hf        = ["torch>=2.4", "transformers>=4.45", "accelerate>=1.0"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  # Not pinned to an exact version, and deliberately not pinned a SECOND time
  # in .pre-commit-config.yaml. The hooks run this same binary, so the two
  # cannot drift apart; a previous config pinned the hook at v0.8.6 against
  # this open range and they disagreed about UP038.
  "ruff>=0.8,<1",
  "mypy>=1.12,<2",
  "pre-commit>=4,<5",
  "detect-secrets>=1.5,<2",
  "types-PyYAML>=6.0",
]
# Application stack. Installing the scientific core pulls NONE of this:
# the core must stay runnable and testable with the standard library and NumPy.
app           = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1"]
orchestration = ["langgraph>=0.2,<1"]
observability = ["opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2",
                 "opentelemetry-exporter-otlp>=1.29,<2"]
policy        = []          # the OPA binary is external; the mirror needs nothing
guardrails    = ["nemoguardrails>=0.11,<1"]
langsmith     = ["langsmith>=0.2,<1"]

all = [
  "handoff-fidelity[tokenizer,ml,figures,data]",
]

[project.scripts]
handoff = "handoff_fidelity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "ARG"]
ignore = [
  "E501",    # long lines are handled by the formatter, not the linter
  "ARG002",  # adapter methods intentionally accept an unused uniform signature
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"src/handoff_fidelity/privacy/scan.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["handoff_fidelity"]
exclude = ["apps.web.*", "apps/web/*"]
mypy_path = "src"
# Not --strict. The codebase is typed throughout, but several modules interface
# with optional third-party libraries that have no stubs; demanding strictness
# there would push toward blanket ignores, which hide real errors.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "apps/api"]
norecursedirs = ["apps/web/node_modules", "apps/web/dist"]
markers = [
  "slow: deselect with '-m \"not slow\"'",
]

[tool.coverage.run]
source = ["src/handoff_fidelity"]
branch = true
